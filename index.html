<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 사이트 아이콘 = 여우씨 (character/fox-body.png에서 머리를 잘라 만듦, 2026-11-05 대표) -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="숲속 여우씨의 디저트 레시피 - 나만의 디저트로 알아보는 성격 테스트" />
    <meta name="theme-color" content="#FBF3E3" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="여우씨의 디저트 레시피" />
    <meta property="og:description" content="숲속 여우씨의 디저트 레시피 - 나만의 디저트로 알아보는 성격 테스트" />
    <meta property="og:url" content="https://dongkdj.github.io/SY_Prj/" />
    <meta property="og:site_name" content="여우씨의 디저트 레시피" />
    <meta property="og:locale" content="ko_KR" />
    <!-- 공유 카드 이미지. 지금은 여우씨 캐릭터를 그대로 쓰는 잠정본이고,
         1200x630 전용 카드를 따로 만들면 그 파일로 교체하면 된다. -->
    <meta property="og:image" content="https://dongkdj.github.io/SY_Prj/og-cover.png" />
    <meta property="og:image:width" content="1224" />
    <meta property="og:image:height" content="1129" />
    <meta property="og:image:alt" content="여우씨 캐릭터" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://dongkdj.github.io/SY_Prj/og-cover.png" />
    <!-- 폰트는 src/main.jsx에서 번들로 로드 (전시장 네트워크 비의존) -->
    <title>여우씨의 디저트 레시피</title>
    <!-- 앱이 못 켜지는 브라우저(오래된 사파리 등)에서 하얀 화면 대신 안내 카드. 어느 브라우저나 읽는 옛 문법으로만 쓴다. (2026-11-09 아이맥 안 뜸) -->
    <script>
      (function () {
        var shown = false;
        function rootFilled() { var r = document.getElementById('root'); return !!(r && r.childNodes.length); }
        function show(detail) {
          if (shown || rootFilled()) return;
          shown = true;
          var d = document.createElement('div');
          d.id = 'old-browser-notice';
          d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:#FBF3E3;color:#5E4632;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px;text-align:center;line-height:1.6;z-index:99999');
          d.innerHTML = '<div style="max-width:28rem;border:3px solid #D6A64A;border-radius:16px;padding:28px 24px;background:#FFF8EC">'
            + '<div style="font-size:20px;font-weight:700">이 브라우저에서는 열리지 않아요</div>'
            + '<div style="margin-top:10px;font-size:15px">크롬(Chrome)으로 열거나, 사파리를 최신 버전으로 업데이트해 주세요.</div>'
            + '<div style="margin-top:14px;font-size:12px;opacity:.7">' + detail + '</div></div>';
          document.body.appendChild(d);
          // 늦게라도 앱이 켜지면(느린 인터넷) 안내를 거둔다
          if (window.MutationObserver) {
            new MutationObserver(function () { if (rootFilled() && d.parentNode) d.parentNode.removeChild(d); })
              .observe(document.getElementById('root'), { childList: true });
          }
        }
        window.addEventListener('error', function (e) {
          var m = (e && e.message) || '';
          if (/SyntaxError|Unexpected token|Invalid regular expression|Unexpected identifier/i.test(m)) show('브라우저가 코드를 읽지 못했습니다: ' + m);
        });
        setTimeout(function () { show('앱이 12초 안에 켜지지 않았습니다'); }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
